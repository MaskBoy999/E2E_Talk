# Repository-wide Cargo configuration.
#
# ── Android: let the WebView load the pinned server certificate ───────────
#
# WHY THIS EXISTS
#
# The server generates a **self-signed** certificate (server/src/main.rs →
# `generate_self_signed_cert`, stored in certs/), and the box's Rust client
# trusts it by pinning the leaf fingerprint on first use (TOFU — see
# src-tauri/src/cert_probe.rs). Android's WebView has no such pin: it does its
# own WebPKI validation, and wry's generated `RustWebViewClient` does **not**
# override `onReceivedSslError` — so Android's default *cancels the load*.
#
# The visible symptom was: "Test connection" succeeds (that call goes through
# Rust, which accepts the pinned cert), then Save & Launch navigates the window
# to the host and it can never render — a blank/black WebView on every launch
# after that, with no tray, no address bar and no back button on a phone to
# escape with. The box was completely unusable on Android.
#
# Wry builds its Android Kotlin from templates and substitutes
# `{{class-extension}}` in `RustWebViewClient.kt` with the value of
# `WRY_RUSTWEBVIEWCLIENT_CLASS_EXTENSION` (see wry-*/build.rs: the variable name
# is `WRY_<FILE_STEM_UPPERCASED>_CLASS_EXTENSION`). Setting it here means the
# override is injected into the generated class on every build, in CI and
# locally, without patching the disposable `src-tauri/gen/android/` project.
#
# WHY `proceed()` IS SAFE HERE
#
# Proceeding is bounded by the pin rather than trusting everything:
#   * static/box-setup.html forces "Trust this server's certificate" on in a box,
#     so a fingerprint is always pinned before any window opens;
#   * `check_pinned_cert` in src-tauri/src/lib.rs refuses to open *or navigate* a
#     window when the host presents a different certificate, so a swapped or
#     MITM certificate is rejected in Rust before this callback is ever reached;
#   * the host is a Tailscale address, so the transport is already an
#     end-to-end-encrypted WireGuard tunnel to the user's own machine.
#
# The override is also guarded from R8/ProGuard stripping in release builds by
# src-tauri/plugins/call-service/android/consumer-proguard-rules.pro.
[env]

WRY_RUSTWEBVIEWCLIENT_CLASS_EXTENSION = { force = true, value = """
    // ── E2E Chat: accept the pinned host certificate ──────────────────────
    // Injected by .cargo/config.toml — see the comment there before changing
    // this. The server is self-signed, so Android's default behaviour (cancel
    // the load) leaves the app on a blank screen forever; the certificate has
    // already been pinned by the Rust side, which refuses to open this window
    // at all if the live certificate no longer matches.
    override fun onReceivedSslError(
        view: WebView,
        handler: android.webkit.SslErrorHandler,
        error: android.net.http.SslError
    ) {
        android.util.Log.w(
            "E2EChat",
            "accepting the pinned server certificate for " + error.url +
                " (primaryError=" + error.primaryError + ")"
        )
        handler.proceed()
    }
""" }

# ── Android: let the WebView capture the screen ──────────────────────────
#
# WHY THIS EXISTS
#
# Android WebView's `getDisplayMedia()` (used by `static/voice.js` `startScreen()`)
# sends a `MediaProjection` permission request to the WebChromeClient. Wry's
# generated `RustWebChromeClient.onPermissionRequest` maps `AUDIO_CAPTURE` /
# `VIDEO_CAPTURE` to the matching Android runtime prompts, but does **not** handle
# `MediaProjection` — which means the display-capture request may be auto-denied.
#
# The symptom: pressing Share screen on Android either does nothing, or the picker
# opens and closes immediately with no track returned.
#
# The fix: override `onPermissionRequest` to grant `MediaProjection` requests
# (they come with `resources = [Manifest.permission.ACCESS_MEDIA_PROJECTION]`).
# This is safe because:
#   * screen capture is always user-initiated (the system picker must be dismissed
#     by the user — the app cannot programmatically capture the screen);
#   * the captured frames go through the same E2EE relay pipeline as camera video;
#   * the user can stop sharing at any time via the in-app button.

[WRY_RUSTWEBCHROME_CLIENT_CLASS_EXTENSION]
WRY_RUSTWEBCHROME_CLIENT_CLASS_EXTENSION = { force = true, value = """
    // ── E2E Chat: allow screen capture (getDisplayMedia) ────────────────────
    // Injected by .cargo/config.toml. Wry's default RustWebChromeClient does not
    // handle MediaProjection permission requests, which getDisplayMedia() needs on
    // Android. Without this override the display-capture request is auto-denied.
    override fun onPermissionRequest(request: PermissionRequest) {
        super.onPermissionRequest(request)
        // Grant MediaProjection requests (screen capture from getDisplayMedia).
        // The user has already approved this via the system picker, so granting
        // here is just completing what the user started.
        if (request.resources.contains(
                android.Manifest.permission.ACCESS_MEDIA_PROJECTION
            ) || request.resources.contains(
                android.Manifest.permission.MEDIA_PROJECTION
            )
        ) {
            request.grant()
        }
    }
""" }
