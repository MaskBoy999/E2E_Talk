[package]
name = "e2e-chat-app"
version = "0.2.3"
description = "E2E Chat — native desktop shell for the encrypted chat app"
authors = ["E2E Chat"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "e2e_chat_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "dynamic-acl"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
# Android foreground-service keepalive for voice calls (inert on desktop).
tauri-plugin-call-service = { path = "plugins/call-service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# TOFU certificate pinning (src/cert_probe.rs). rustls must be the SAME 0.23.x
# reqwest uses, so `use_preconfigured_tls` recognises the config; `ring` is the
# provider reqwest's rustls-tls feature already enables.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
sha2 = "0.10"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
