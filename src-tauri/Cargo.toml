[package]
name = "e2e-chat-app"
version = "0.2.16"
description = "E2E Chat — native desktop shell for the encrypted chat app"
authors = ["E2E Chat"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "e2e_chat_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "dynamic-acl"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
# Android foreground-service keepalive for voice calls (inert on desktop).
tauri-plugin-call-service = { path = "plugins/call-service" }
# Android shell behaviour: immersive system bars + a Back button that closes the
# current layer instead of the app (inert on desktop).
tauri-plugin-box-shell = { path = "plugins/box-shell" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# TOFU certificate pinning (src/cert_probe.rs). rustls must be the SAME 0.23.x
# reqwest uses, so `use_preconfigured_tls` recognises the config; `ring` is the
# provider reqwest's rustls-tls feature already enables.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
sha2 = "0.10"
url = "2"

# Desktop-only: a second launch focuses the first instance's window instead of
# spawning a duplicate app (two tray icons, racing config writers).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Windows-only: the WebView2 certificate and permission hooks (src/win_webview.rs).
# Both versions are the ones tauri/wry already build, so this adds no compilation
# — it only makes the interfaces nameable from this crate.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Deliberately NOT `panic = "abort"`. Aborting turns any panic into an instant,
# silent process death: the windowed subsystem hides stderr, so a bug in a
# command looks like "the app just closed" with nothing to go on (that is
# exactly how the Save & Launch crash presented). Unwinding lets the panic
# surface and keeps the app alive.
strip = true
