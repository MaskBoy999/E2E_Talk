[default]
description = """
Keep an active voice call alive while the screen is off or the app is
backgrounded (start/stop the Android foreground service), and raise the
full-screen incoming-call notification when a call arrives while the app is
not in the foreground.
"""
# NOTE: the identifier is spelled exactly as `build.rs`'s tauri-plugin build
# script generates it (`allow-` + the Kotlin command name, so `updateMedia` →
# `allow-updateMedia`). The two older hand-written entries below keep their
# kebab-case spelling because that is the file name/default they were created
# with; renaming either side would break the ACL at compile time.
permissions = [
    "allow-start",
    "allow-updateMedia",
    # 1.1: the page syncing mute/deafen into the ongoing notification's
    # action labels (Mute/Unmute, Deafen/Undeafen).
    "allow-updateCallState",
    "allow-stop",
    "allow-incoming-call",
    "allow-cancel-incoming",
    # Native screen capture: the Android WebView has no getDisplayMedia, so the
    # page asks the plugin to run MediaProjection instead (and to stop it).
    "allow-startScreenCapture",
    "allow-stopScreenCapture",
    # Native picture-in-picture (the Android WebView has no PiP API): enter it for
    # a tile, poll whether the window is still up, and leave it.
    "allow-enterPip",
    "allow-pipState",
    "allow-exitPip",
    # The phone's ringer mode + do-not-disturb state, read before the app rings
    # its own (WebAudio) ringtone.
    "allow-getAudioProfile",
]
