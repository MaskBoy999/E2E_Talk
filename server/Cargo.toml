[package]
name = "e2e-chat"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
argon2 = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
subtle = "2"
rcgen = "0.13"
rustls-pemfile = "2"
local-ip-address = "0.6"
url = "2.5.8"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
# Web Push (VAPID): P-256 for the VAPID JWT + message encryption,
# AES-128-GCM for the RFC 8291 aes128gcm payload, HMAC-SHA256 for HKDF.
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
aes-gcm = "0.10"
hmac = "0.12"
