<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E2E Chat - Admin</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="auth-container">
        <!-- Admin Login -->
        <div id="admin-login" class="auth-card">
            <h1>Admin Panel</h1>
            <p class="subtitle">Enter admin password</p>
            <div id="error-message" class="error" style="display: none;"></div>
            <form id="admin-login-form">
                <input type="password" id="admin-password" placeholder="Admin password" required>
                <button type="submit">Access Panel</button>
            </form>
            <p class="toggle"><a href="index.html">Back to chat</a></p>
        </div>

        <!-- Admin Panel (hidden until authenticated) -->
        <div id="admin-panel" class="admin-card" style="display: none;">
            <div class="admin-header">
                <h1>Admin Panel</h1>
                <a href="index.html" class="back-link">Back to chat</a>
            </div>

            <div id="error-message2" class="error" style="display: none;"></div>

            <div class="user-table-container">
                <table class="user-table">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>User ID</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="user-list">
                        <tr><td colspan="3" style="text-align:center;color:#666;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="confirm-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3>Delete User</h3>
            <p>Are you sure you want to delete <strong id="delete-username"></strong>?</p>
            <p class="warning">This will permanently remove their account and all messages.</p>
            <div class="modal-actions">
                <button id="confirm-cancel" class="btn-cancel">Cancel</button>
                <button id="confirm-delete" class="btn-delete">Delete</button>
            </div>
        </div>
    </div>

    <script src="admin.js?v=2"></script>
</body>
</html>
