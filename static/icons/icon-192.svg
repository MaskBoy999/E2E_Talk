<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="38" fill="#0d0d1a"/>
  <defs>
    <clipPath id="circleClip">
      <circle cx="96" cy="96" r="96"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circleClip)">
    <!-- Background -->
    <circle cx="96" cy="96" r="96" fill="#0d0d1a"/>
    
    <!-- Gold/yellowish-brown ring (top-right) -->
    <circle cx="110" cy="82" r="38" fill="none" stroke="#d4a843" stroke-width="10"/>
    <circle cx="110" cy="82" r="14" fill="#d4a843"/>
    
    <!-- Cyan/teal-blue ring (bottom-left) -->
    <circle cx="82" cy="110" r="38" fill="none" stroke="#4fc3f7" stroke-width="10"/>
    <circle cx="82" cy="110" r="14" fill="#4fc3f7"/>
    
    <!-- Small accent element (like an 'i' info icon) -->
    <rect x="132" y="88" width="6" height="18" rx="2" fill="#ffffff"/>
    <circle cx="135" cy="76" r="3.5" fill="#ffffff"/>
  </g>
</svg>
