<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E2E Chat - Pair Device</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>E2E Chat</h1>
            <p class="subtitle">Pair New Device</p>
            <div class="u-e0353df0" id="pairing-status" >
                <p>Loading pairing ticket...</p>
            </div>
            <div id="pairing-password-form" style="display:none; text-align: center; margin-top: 16px;">
                <p class="u-50a9f4d8" >Enter your password to restore encryption keys:</p>
                <input class="u-79e9ae17" type="password" id="pairing-password" placeholder="Password" >
                <br>
                <button class="u-8f4657f5" id="pairing-restore-btn" >Restore Keys &amp; Login</button>
                <p id="pairing-restore-error" style="color: #e74c3c; font-size: 12px; margin-top: 8px; display: none;"></p>
            </div>
            <div id="pairing-result" style="display:none; text-align: center;">
                <p class="u-2b23e100" >&#10003; Paired!</p>
                <p class="u-fb154ad0" >You are now logged in. <a href="index.html">Go to Chat</a></p>
            </div>
        </div>
    </div>
    <script src="qrcode.js"></script>
    <script src="crypto.js"></script>
    <!-- Pairing logic lives in an external file so the CSP needs no
         'unsafe-inline'; the buttons get real listeners instead of inline
         event attributes. -->
    <script src="pair.js?v=1"></script>
</body>
</html>
