<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E2E Chat - Login</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>E2E Chat</h1>
            <p class="subtitle">LAN chat with friends</p>

            <div id="error-message" class="error" style="display: none;"></div>

            <!-- Login Form -->
            <form id="login-form">
                <h2>Login</h2>
                <input type="text" id="login-username" placeholder="Username" required autocomplete="username">
                <div class="auth-input-row">
                    <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password" class="auth-code-input">
                    <button type="button" class="toggle-visibility-btn" id="toggle-login-password" title="Show/Hide">&#128065;</button>
                </div>
                <button type="submit">Login</button>
                <p class="toggle">Don't have an account? <a href="#" id="show-register">Register</a></p>
                <p class="toggle"><a href="admin.html" class="admin-link-login">Host Admin</a></p>
                <p class="toggle" style="margin-top:12px"><a href="#" id="show-connect-key">Connect with Local Key</a></p>
            </form>
            <div id="connect-key-section" style="display:none;margin-top:16px;border-top:1px solid #2a2a4a;padding-top:16px;">
                <p style="color:#999;font-size:13px;margin-bottom:10px;text-align:center">Connect from another device</p>
                <input type="text" id="connect-username" placeholder="Username" required autocomplete="username" style="width:100%;padding:10px 14px;margin-bottom:8px;border:1px solid #2a2a4a;border-radius:8px;background:#1a1a2e;color:#e0e0e0;font-size:14px;">
                <div class="auth-input-row" style="margin-bottom:8px;">
                    <input type="password" id="connect-password" placeholder="Password" required autocomplete="current-password" class="auth-code-input">
                    <button type="button" class="toggle-visibility-btn" id="toggle-connect-password" title="Show/Hide">&#128065;</button>
                </div>
                <div class="auth-input-row" style="margin-bottom:10px;">
                    <input type="password" id="connect-key-input" placeholder="Paste your local key" class="auth-code-input" style="font-family:monospace;letter-spacing:1px;" autocomplete="off">
                    <button type="button" class="toggle-visibility-btn" id="toggle-connect-key" title="Show/Hide">&#128065;</button>
                </div>
                <div id="connect-key-error" style="color:var(--danger);margin-bottom:10px;display:none;font-size:13px"></div>
                <div style="display:flex;gap:8px;">
                    <button id="connect-key-btn" style="flex:1;padding:10px;background:#4a4a8a;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;">Connect with Key</button>
                    <button id="scan-qr-btn" style="padding:10px 14px;background:#2a2a4a;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;" title="Scan QR Code">📷</button>
                </div>
                <div class="qr-import-section" style="margin-top:10px;">
                    <button id="import-qr-btn" style="width:100%;padding:8px;background:transparent;color:#4fc3f7;border:1px solid #2a2a4a;border-radius:8px;cursor:pointer;font-size:13px;">📷 Import QR Code from Image</button>
                    <input type="file" id="qr-file-input" accept="image/*" style="display:none">
                </div>
                <div id="qr-scanner-section" style="display:none;margin-top:12px;">
                    <video id="qr-video" style="width:100%;max-width:300px;border-radius:8px;background:#000;"></video>
                    <button id="stop-scan-btn" style="width:100%;margin-top:8px;padding:8px;background:#f44336;color:#fff;border:none;border-radius:8px;cursor:pointer;">Stop Scanning</button>
                </div>
            </div>

            <!-- Register Form -->
            <form id="register-form" style="display: none;">
                <h2>Register</h2>
                <input type="text" id="register-username" placeholder="Pick a username" required autocomplete="username">
                <div class="auth-input-row">
                    <input type="password" id="register-password" placeholder="Password (min 6 chars)" required minlength="6" autocomplete="new-password" class="auth-code-input">
                    <button type="button" class="toggle-visibility-btn" id="toggle-register-password" title="Show/Hide">&#128065;</button>
                </div>
                <button type="submit">Register</button>
                <p class="toggle">Already have an account? <a href="#" id="show-login">Login</a></p>
                <p class="toggle"><a href="admin.html" class="admin-link-login">Host Admin</a></p>
            </form>
        </div>
    </div>
    <script src="crypto.js?v=6"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script src="auth.js?v=5"></script>
</body>
</html>
