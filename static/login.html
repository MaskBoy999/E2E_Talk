<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E2E Chat - Login</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>E2E Chat</h1>
            <p class="subtitle">LAN chat with friends</p>

            <div id="error-message" class="error" style="display: none;"></div>

            <!-- Login Form -->
            <form id="login-form">
                <h2>Login</h2>
                <input type="text" id="login-username" placeholder="Username" required autocomplete="username">
                <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
                <button type="submit">Login</button>
                <p class="toggle">Don't have an account? <a href="#" id="show-register">Register</a></p>
                <p class="toggle"><a href="admin.html" class="admin-link-login">Host Admin</a></p>
            </form>

            <!-- Connect with Local Key -->
            <div id="connect-key-section" style="display:none;margin-top:16px;border-top:1px solid #2a2a4a;padding-top:16px;">
                <p style="color:#999;font-size:13px;margin-bottom:10px;text-align:center">Connect from another device</p>
                <input type="text" id="connect-username" placeholder="Username" required autocomplete="username" style="width:100%;padding:10px 14px;margin-bottom:8px;border:1px solid #2a2a4a;border-radius:8px;background:#1a1a2e;color:#e0e0e0;font-size:14px;">
                <input type="password" id="connect-password" placeholder="Password" required autocomplete="current-password" style="width:100%;padding:10px 14px;margin-bottom:8px;border:1px solid #2a2a4a;border-radius:8px;background:#1a1a2e;color:#e0e0e0;font-size:14px;">
                <input type="text" id="connect-key-input" placeholder="Paste your local key" style="width:100%;padding:10px 14px;margin-bottom:10px;border:1px solid #2a2a4a;border-radius:8px;background:#1a1a2e;color:#e0e0e0;font-size:14px;font-family:monospace;letter-spacing:1px;" autocomplete="off">
                <div id="connect-key-error" style="color:var(--danger);margin-bottom:10px;display:none;font-size:13px"></div>
                <button id="connect-key-btn" style="width:100%;padding:10px;background:#4a4a8a;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;">Connect with Key</button>
            </div>
            <p class="toggle" style="margin-top:12px"><a href="#" id="show-connect-key">Connect with Local Key</a></p>

            <!-- Register Form -->
            <form id="register-form" style="display: none;">
                <h2>Register</h2>
                <input type="text" id="register-username" placeholder="Pick a username" required autocomplete="username">
                <input type="password" id="register-password" placeholder="Password (min 6 chars)" required minlength="6" autocomplete="new-password">
                <button type="submit">Register</button>
                <p class="toggle">Already have an account? <a href="#" id="show-login">Login</a></p>
                <p class="toggle"><a href="admin.html" class="admin-link-login">Host Admin</a></p>
            </form>
        </div>
    </div>
    <script src="crypto.js?v=6"></script>
    <script src="auth.js?v=3"></script>
</body>
</html>
