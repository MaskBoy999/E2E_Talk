<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E2E Chat - Login</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></symbol>
</svg>
    <div class="auth-container">
        <div class="auth-card">
            <h1>E2E Chat</h1>
            <p class="subtitle">LAN chat with friends</p>

            <div id="error-message" class="error" style="display: none;"></div>


            <!-- Login Form -->
            <form id="login-form">
                <h2>Login</h2>
                <input type="text" id="login-username" placeholder="Username" required autocomplete="username">
                <div class="auth-input-row">
                    <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password" class="auth-code-input">
                    <button type="button" class="toggle-visibility-btn" id="toggle-login-password" title="Show/Hide"><svg class="ui-icon" width="14" height="14"><use href="#icon-eye"/></svg></button>
                </div>
                <button type="submit">Login</button>
                <p class="toggle">Don't have an account? <a href="#" id="show-register">Register</a></p>
                <p class="toggle"><a href="admin.html" class="admin-link-login">Host Admin</a></p>
            </form>

            <!-- Two-Factor Code Step (shown when the account has 2FA enabled) -->
            <form id="login-2fa-form" style="display:none;">
                <h2>Two-Factor Authentication</h2>
                <p class="subtitle">Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
                <input type="text" id="login-2fa-code" placeholder="Code" required autocomplete="one-time-code" maxlength="12" inputmode="text">
                <p id="login-2fa-error" class="error" style="display:none;"></p>
                <button type="submit">Verify &amp; Log In</button>
                <button type="button" id="login-2fa-back" style="background:none;border:none;color:var(--accent,#5865F2);cursor:pointer;margin-top:10px;font-size:13px;">&larr; Back to login</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" style="display: none;">
                <h2>Register</h2>
                <input type="text" id="register-username" placeholder="Pick a username" required autocomplete="username">
                <div class="auth-input-row">
                    <input type="password" id="register-password" placeholder="Password (min 6 chars)" required minlength="6" autocomplete="new-password" class="auth-code-input">
                    <button type="button" class="toggle-visibility-btn" id="toggle-register-password" title="Show/Hide"><svg class="ui-icon" width="14" height="14"><use href="#icon-eye"/></svg></button>
                </div>
                <div class="auth-input-row">
                    <input type="password" id="register-confirm-password" placeholder="Confirm password" required autocomplete="off" class="auth-code-input">
                    <button type="button" class="toggle-visibility-btn" id="toggle-register-confirm-password" title="Show/Hide"><svg class="ui-icon" width="14" height="14"><use href="#icon-eye"/></svg></button>
                </div>
                <button type="submit">Register</button>
                <p class="toggle">Already have an account? <a href="#" id="show-login">Login</a></p>
                <p class="toggle"><a href="admin.html" class="admin-link-login">Host Admin</a></p>
            </form>

        </div>
    </div>
    <script src="libsodium-sumo.js"></script>
    <script src="libsodium-wrappers.js"></script>
<script src="crypto.js?v=10"></script>
<script src="keyvault.js?v=2"></script>
<script src="secure-storage.js?v=4"></script>
    <script src="ui-dialog.js?v=1"></script>
    <script src="auth.js?v=12"></script>
    <!-- Android shell: immersive system bars + Back closing the top layer.
         Inert in a browser and on desktop (see the file's header). -->
    <script src="box-shell.js?v=5"></script>
</body>
</html>
