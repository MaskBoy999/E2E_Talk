name: Build Android APK

# Produces a sideloadable .apk. Attached to the release on a v* tag, or uploaded
# as a workflow artifact on a manual run.
#
# NOTE: this is the documented Tauri Android flow; the NDK/SDK versions below may
# need bumping as GitHub's runners update.
#
# The APK is signed in CI (see "Sign the APK") because a Tauri release build is
# unsigned by default and Android refuses to install an unsigned APK.
#
# The CLI is PINNED (2.11.2): `"^2"` floats to whatever shipped overnight and
# would silently change the generated Gradle template underneath us. The
# template at this tag declares `compileSdk = 36` / `targetSdk = 36`, so the
# setup step installs `platforms;android-36` to match.
#
# What actually broke the APK — both invisible in CI until the log-tail step
# below started re-emitting the tail as annotations:
#   1. `unminimize()` is desktop-only in Tauri, but lib.rs called it from code
#      that also compiles for Android → rustc E0599, exit code 101. This failed
#      every v0.2.1-v0.2.5 build.
#   2. The runner presets ANDROID_SDK_ROOT to /usr/local/lib/android/sdk, which
#      disagreed with the ANDROID_HOME this workflow sets → AGP refused to
#      resolve the release task's dependencies. This is what failed v0.2.6,
#      after the Rust lib and its .so had already built successfully.
#   3. With both fixed, Gradle finally got to assemble and ran 8m31s before
#      failing. The log-tail step re-emitted only the last 8 lines, which for a
#      Gradle failure are a multi-KB `Io(Env(...))` dump plus deprecation noise —
#      so the failing task was STILL hidden. That step now re-emits Gradle's
#      "What went wrong" block instead of the raw tail.
#   4. The local `call-service` plugin declared
#      `android:foregroundServiceType="mediaCall"`, which is not a foreground
#      service type at all — AAPT failed the resource link, so nothing was ever
#      assembled. The type for an ongoing call is `phoneCall`, plus
#      FOREGROUND_SERVICE_PHONE_CALL and MANAGE_OWN_CALLS.
#   5. Even with that fixed, Gradle's `rustBuildArm64Release` could not run:
#      the generated project builds Rust through
#      `npm run -- tauri android android-studio-script`, and this repo had no
#      `tauri` npm script and no installed CLI, so it died with
#      `npm error Missing script: "tauri"` and produced no .so at all. Gradle
#      runs that task in parallel with resource processing, which is why the
#      AAPT error masked it. Fixed by depending on @tauri-apps/cli and
#      installing it (`npm ci`) before the build.
#
# Verified locally on Windows (SDK 36 + NDK 27): `npx tauri android build --apk
# --target aarch64` produces app-universal-release-unsigned.apk with
# lib/arm64-v8a/libe2e_chat_app_lib.so inside, and the merged manifest carries
# foregroundServiceType="phoneCall" plus RECORD_AUDIO / CAMERA / POST_NOTIFICATIONS.
#
# The build is intentionally arm64-v8a only (see "Build APK"): that is the one
# ABI whose Rust + NDK link is proven to work here, and it covers every phone
# capable of installing this app.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# `gh release upload` appends the APK to the tagged release, which needs write
# access to contents.
permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK + NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          # The runner image presets ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          # while this step installs into $ANDROID_HOME. AGP refuses to continue
          # when the two disagree ("Several environment variables and/or system
          # properties contain different paths to the SDK"), which is what
          # killed the v0.2.6 build — after the Rust lib and its .so had already
          # built and been symlinked into jniLibs. Point both at one SDK.
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # GITHUB_PATH only affects LATER steps, so within this step invoke
          # sdkmanager by absolute path (a bare `sdkmanager` here fails with
          # "command not found").
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Licences MUST be accepted against the same --sdk_root we install
          # into. This call previously had no --sdk_root and ANDROID_HOME was
          # not exported, so the acceptances landed on the default root.
          # Consequence: anything Gradle auto-installs into OUR root later fails
          # with "some licences have not been accepted", and the build dies.
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          # compileSdk/targetSdk are 36 in the pinned CLI's own template
          # (tauri-cli-v2.11.2 crates/tauri-cli/templates/mobile/android/app/
          # build.gradle.kts). The previous platform build-tools 34.0.0 pins
          # could never satisfy that, which is what broke every APK build.
          "$SDKM" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The CLI comes from npm rather than `cargo install` because the generated
      # Gradle project needs it *there*: `gen/android/buildSrc/.../BuildTask.kt`
      # (written by `android init`) builds Rust with
      # `npm run -- tauri android android-studio-script`, which resolves
      # `node_modules/.bin/tauri`. With no installed CLI that step fails
      # (`npm error Missing script: "tauri"`) — see note 5 above. Using the
      # prebuilt binary also drops a ~6-minute `cargo install tauri-cli`
      # compile. Same 2.11.2 as before, pinned in package.json.
      - name: Install Tauri CLI + JS deps
        run: |
          npm ci
          npx tauri --version

      - name: Init Android project (idempotent)
        working-directory: src-tauri
        run: |
          if [ ! -d gen/android ]; then npx tauri android init; fi

      # The Gradle error summary is buried thousands of lines above the final
      # exit code, so a plain `run:` step shows "exit code 1" with nothing
      # actionable. Tee the full output to a file and ALWAYS dump its tail in
      # the next step (where the Gradle "What went wrong" block lives).
      - name: Build APK
        working-directory: src-tauri
        shell: bash
        run: |
          set -o pipefail
          EXIT=0
          # --target aarch64 builds ONLY arm64-v8a. The default builds all four
          # ABIs (aarch64, armv7, i686, x86_64), which multiplies the CI time
          # and drags in two 32-bit toolchains for no benefit: every device that
          # can install this app publishes arm64-v8a. It is deliberately NOT
          # paired with removing rustup targets above — if Gradle still wants
          # another ABI, keeping the targets installed avoids turning an ABI
          # filter into a hard "target may not be installed" failure.
          # Add `--target x86_64` here to also get an emulator-compatible APK.
          npx tauri android build --apk --target aarch64 2>&1 | tee android-build.log || EXIT=$?
          echo "BUILD_EXIT=$EXIT" >> "$GITHUB_ENV"
          exit $EXIT

      # ---------------------------------------------------------------------
      # The box cannot render the app at all without this, and nothing else
      # would notice if it went missing — a blank screen on a phone is exactly
      # what this workflow exists to prevent.
      #
      # The server's certificate is self-signed, Android's WebView cancels any
      # load it cannot verify, and wry's generated `RustWebViewClient` does not
      # override `onReceivedSslError`. The override is injected by wry's
      # `{{class-extension}}` hook, configured in `.cargo/config.toml`
      # (`WRY_RUSTWEBVIEWCLIENT_CLASS_EXTENSION`). Two things can silently break
      # it: the env var stops reaching wry (a wry change, or that config file
      # being dropped), or R8 strips the override from the minified release
      # build (the consumer rule in the call-service plugin prevents that).
      # Both halves are cheap to check here and impossible to check afterwards.
      # ---------------------------------------------------------------------
      - name: Verify the pinned-certificate WebView override survived
        if: env.BUILD_EXIT == '0'
        working-directory: src-tauri
        shell: bash
        run: |
          set -e
          GEN=$(find gen/android/app/src/main/java -name 'RustWebViewClient.kt' -print -quit)
          if [ -z "$GEN" ]; then
            echo "::error::No generated RustWebViewClient.kt — the Android codegen did not run."
            exit 1
          fi
          if ! grep -q 'onReceivedSslError' "$GEN"; then
            echo "::error::WRY_RUSTWEBVIEWCLIENT_CLASS_EXTENSION did not reach the generated WebView client ($GEN). Check .cargo/config.toml [env] — without the override Android cancels the (self-signed) certificate and the app shows a blank screen."
            exit 1
          fi
          echo "Generated client carries the override:"
          grep -n -A 8 'onReceivedSslError' "$GEN" | head -20

          APK=$(find gen/android/app/build/outputs/apk -name '*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::No APK to inspect."
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/dexcheck"
          # python3 rather than `unzip`: guaranteed on the runner, no extra apt.
          python3 - "$APK" "$RUNNER_TEMP/dexcheck" <<'PY'
          import os, sys, zipfile
          apk, out = sys.argv[1], sys.argv[2]
          os.makedirs(out, exist_ok=True)
          with zipfile.ZipFile(apk) as z:
              for name in z.namelist():
                  if name.startswith('classes') and name.endswith('.dex'):
                      z.extract(name, out)
          PY
          if ! grep -rqa 'onReceivedSslError' "$RUNNER_TEMP/dexcheck"; then
            echo "::error::onReceivedSslError is absent from the minified release dex — R8 stripped the override, so the release APK would show a blank screen. Check the consumer proguard rules in src-tauri/plugins/call-service/android/."
            exit 1
          fi
          echo "Release dex keeps the override (R8 did not strip it)."

      # ---------------------------------------------------------------------
      # Android refuses to install an UNSIGNED apk, and a release build here is
      # unsigned: Tauri only signs when `gen/android/app/build.gradle.kts` has a
      # signingConfigs block (per the Tauri docs), and that project is generated
      # in CI. Rather than patch generated Gradle, sign the output ourselves:
      #
      #   * with your upload keystore when ANDROID_KEYSTORE_BASE64 is set;
      #   * otherwise with a throwaway debug keystore, so the download works
      #     today (this is what `adb install` of a dev build uses anyway).
      #
      # Either way the result is verified with `apksigner verify`, so an
      # uninstallable APK can never be published silently.
      # ---------------------------------------------------------------------
      # Runs whether the build passed or failed: on failure this is the only
      # place the actual Gradle/Rust error is visible (job logs need auth to
      # read on public repos too).
      - name: Show build log tail (always)
        if: always()
        working-directory: src-tauri
        shell: bash
        run: |
          echo "Build exit code: ${BUILD_EXIT:-0}"
          if [ ! -f android-build.log ]; then
            echo "(no android-build.log produced)"
            exit 0
          fi
          tail -n 120 android-build.log

          # Job logs need auth even on a public repo, so everything above is
          # invisible to anyone not signed in as the owner — while annotations
          # ARE public. On failure, re-emit the interesting part of the log as
          # a single multi-line ::error:: annotation (GitHub allows ~64KB per
          # annotation but caps a step at 10 annotations, so packing whole
          # block into one beats one-line-each).
          #
          # NOT the raw tail. The last lines are a giant `Io(Env(...))` command
          # dump plus Gradle deprecation noise, which is exactly what made the
          # v0.2.7 annotation useless: it buried the `What went wrong` block
          # that actually names the failing task. Anchor on Gradle's FAILURE
          # line (or the first rustc error) and window forward from there.
          if [ "${BUILD_EXIT:-0}" != "0" ]; then
            echo "--- annotations ---"
            START=$(grep -n -m1 -E '^FAILURE: Build failed|^error(\[|:)' android-build.log | cut -d: -f1)
            if [ -n "$START" ]; then
              [ "$START" -gt 6 ] && START=$((START - 6))
            else
              START=$(( $(wc -l < android-build.log) - 40 ))
              [ "$START" -gt 1 ] || START=1
            fi
            # Truncate each line before joining, and drop the `Io(Env(...))`
            # tail of the CLI's error — it is a multi-KB dump of every env var
            # and only the message before it is worth reading.
            BLOCK=$(sed -n "${START},$((START + 55))p" android-build.log \
              | sed -e 's/Io(.*//' -e 's/%/%25/g' -e 's/\r$//' \
              | cut -c1-400 \
              | sed ':a;N;$!ba;s/\n/%0A/g' \
              | cut -c1-16000)
            if [ -n "$BLOCK" ]; then
              printf '::error::%s\n' "$BLOCK"
            fi
          fi

      - name: Sign the APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          # Prefer an already-signed artifact; a release build is normally
          # named `*-unsigned.apk`, so the fallback is the common case.
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' ! -name '*unsigned*' -print -quit)"
          [ -n "$APK" ] || APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::The Android build produced no APK at all."
            exit 1
          fi
          echo "Signing $APK"

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Using the upload keystore from repository secrets."
            KS="$RUNNER_TEMP/upload-keystore.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
            ALIAS="$ANDROID_KEY_ALIAS"
            PW="$ANDROID_KEY_PASSWORD"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            # A tagged release MUST carry the owner's key. This branch used to
            # fall through to the debug key, which silently published v0.2.1-v0.2.9
            # with a *different, freshly generated* signature on every run: nothing
            # could install over the previous release
            # (INSTALL_FAILED_UPDATE_INCOMPATIBLE), and fixing it afterwards forces
            # every installed user to uninstall first — which wipes the app's local
            # keys. Refuse loudly instead of shipping that again.
            echo "::error::Refusing to publish $GITHUB_REF_NAME: ANDROID_KEYSTORE_BASE64 is not visible to this workflow, so the APK would be signed with a throwaway debug key and could never install over a previous release. Check Settings -> Secrets and variables -> Actions -> *Secrets* (not Variables), with the exact names ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. To get a debug-signed test artifact without publishing, use Run workflow (workflow_dispatch) instead of a tag."
            exit 1
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — this *manual* build is signed with a throwaway debug key. Tagged releases refuse to publish without it."
            KS="$RUNNER_TEMP/debug.jks"
            ALIAS="androiddebugkey"
            PW="android"
            keytool -genkeypair -v -keystore "$KS" -storepass "$PW" -keypass "$PW" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          NAME="E2E-Chat-${GITHUB_REF_NAME}-android.apk"
          mkdir -p dist
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" dist/unaligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KS" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$PW" --key-pass "pass:$PW" \
            --out "dist/$NAME" dist/unaligned.apk
          rm -f dist/unaligned.apk
          # Hard proof the artifact is installable.
          "$BUILD_TOOLS/apksigner" verify --print-certs "dist/$NAME"
          ls -la dist

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: e2e-chat-android
          path: dist/*.apk
          if-no-files-found: error

      - name: Generate checksums
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd dist
          sha256sum *.apk > SHA256SUMS-android.txt
          cat SHA256SUMS-android.txt

      # ---------------------------------------------------------------------
      # softprops/action-gh-release used to do this and failed on the v0.2.22
      # and v0.2.24 tags ("already_exists" / "Resource not accessible by
      # integration", because the desktop workflow had already created the
      # release). `gh release upload --clobber` appends to an existing release
      # and is safe to re-run, so this step can no longer be the thing that
      # leaves a release without its APK.
      # ---------------------------------------------------------------------
      - name: Attach APK + checksums to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # The desktop workflow owns the release notes. Both workflows start
          # at the tag push, so this one may get here first — create the
          # release in that case and let the desktop leg fill the notes in.
          # An existing release is left alone: this token can create releases
          # and upload assets but `update-a-release` (a PATCH) is refused with
          # "Resource not accessible by integration", so editing one would fail
          # here and take the APK down with it.
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "E2E Chat $tag" --generate-notes \
            || echo "note: could not create $tag (assuming it exists); uploading anyway"
          # Listed explicitly, not left to gh to glob: an unmatched pattern is
          # an error there, while the APK and its checksum are both produced by
          # this job and must both reach the release.
          shopt -s nullglob
          files=(dist/*.apk dist/SHA256SUMS-android.txt)
          if [ ${#files[@]} -ne 2 ]; then
            echo "::error::Expected the APK and SHA256SUMS-android.txt (found: ${files[*]:-none})."
            exit 1
          fi
          gh release upload "$tag" "${files[@]}" --clobber
          # A log line only: never allowed to fail the step after the upload.
          gh release view "$tag" --json assets \
            --jq '"assets now: " + ([.assets[].name] | sort | join(", "))' || true
