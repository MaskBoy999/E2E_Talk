name: Build Android APK

# Produces a sideloadable .apk. Attached to the release on a v* tag, or uploaded
# as a workflow artifact on a manual run.
#
# NOTE: this is the documented Tauri Android flow; the NDK/SDK versions below may
# need bumping as GitHub's runners update. It has not been run yet.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK + NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Init Android project (idempotent)
        working-directory: src-tauri
        run: |
          if [ ! -d gen/android ]; then cargo tauri android init; fi

      - name: Build APK
        working-directory: src-tauri
        run: cargo tauri android build --apk

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: e2e-chat-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      # ---------------------------------------------------------------------
      # Tag push → attach the APK to the same GitHub Release the desktop job
      # creates, so users get every platform from one page. Runs after the
      # desktop matrix has had time to create the release; the action creates
      # it if this job happens to win the race.
      # ---------------------------------------------------------------------
      - name: Stage APK for release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec cp {} dist/E2E-Chat-${{ github.ref_name }}-android.apk \;
          ls -la dist

      - name: Generate checksums
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd dist
          sha256sum *.apk > SHA256SUMS-android.txt
          cat SHA256SUMS-android.txt

      - name: Attach APK + checksums to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS-android.txt
          fail_on_unmatched_files: false
