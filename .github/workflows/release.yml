name: Build Desktop Box

# Push a tag like v0.2.2 to publish installers users can download straight from
# the GitHub Releases page. Run it manually from the Actions tab to get the
# installers as workflow artifacts without publishing a release.
#
# Code signing is OPTIONAL and secret-gated: with no secrets configured the
# builds still succeed, they just warn on first launch (SmartScreen). Configure
# these repository secrets to turn it on:
#
#   Windows code signing
#     WINDOWS_CERTIFICATE             base64 of a code-signing .pfx
#     WINDOWS_CERTIFICATE_PASSWORD    password for that .pfx
#
# There is deliberately NO auto-updater (users re-download each release — see
# WEBSITE_IN_A_BOX_MASTER_PLAN.md §8), so no update-signing key is involved.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# tauri-action creates/updates the Release, so the token needs write access.
# Without this the build succeeds but publishing fails silently in some repos.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
            label: linux-x64
          - platform: windows-latest
            args: ''
            label: windows-x64
    runs-on: ${{ matrix.platform }}
    # `secrets` is not usable in step `if:` conditions, so the signing secrets
    # are surfaced as env vars and the gates below test `env.*`.
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      # Same trick, same reason: a step `if:` can read job env but not
      # `secrets`, so the AUR key is surfaced here. Unset → the AUR publish
      # step below is skipped and the release is unaffected.
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux toolchain.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ---------------------------------------------------------------------
      # tauri-action builds by running the *project's own* script
      # (`npm run tauri build -- --config …`), so the CLI has to be installed —
      # package.json declares it, but with no node_modules on the runner npm
      # fails (exit 127 / "Missing script"). That is why every desktop release
      # from v0.2.1 on failed here while the Android workflow, which does run
      # `npm ci`, kept getting further. Same root cause, same fix.
      # ---------------------------------------------------------------------
      - name: Install Tauri CLI
        run: npm ci

      # ---------------------------------------------------------------------
      # A single config file carries the optional build tweaks, so we never have
      # to pass two `--config` flags (their precedence is easy to get wrong).
      # Starts as an empty object; the Windows step below merges the cert into
      # it when a certificate secret exists.
      # ---------------------------------------------------------------------
      - name: Prepare signing config
        shell: bash
        run: |
          echo '{}' > ci-signing.conf.json
          # `pwd -W` (Git Bash) yields a Windows path the Rust CLI can open;
          # plain `pwd` is the POSIX path on Linux.
          workdir="$(pwd -W 2>/dev/null || pwd)"
          echo "SIGNING_ARGS=--config \"$workdir/ci-signing.conf.json\"" >> "$GITHUB_ENV"
          cat ci-signing.conf.json

      # ---------------------------------------------------------------------
      # Windows: import the .pfx, read its thumbprint, and merge it into the
      # same config file so every .exe/.msi is signed with it.
      # ---------------------------------------------------------------------
      - name: Import Windows code signing certificate
        id: win-sign
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, $bytes)
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          $conf = Join-Path $env:GITHUB_WORKSPACE 'ci-signing.conf.json'
          $json = if (Test-Path $conf) { Get-Content $conf -Raw | ConvertFrom-Json } else { [pscustomobject]@{} }
          if (-not $json.PSObject.Properties['bundle']) {
            $json | Add-Member -NotePropertyName bundle -NotePropertyValue ([pscustomobject]@{})
          }
          $json.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm       = 'sha256'
            timestampUrl          = 'http://timestamp.digicert.com'
          }) -Force
          $json | ConvertTo-Json -Depth 8 | Set-Content -Path $conf -Encoding utf8
          Write-Host "Signing with thumbprint $($cert.Thumbprint)"

      # Tag push → build AND publish a downloadable release.
      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'E2E Chat ${{ github.ref_name }}'
          releaseBody: |
            Native desktop app for E2E Chat — no browser required.

            **Install:** download the file for your platform below and run it.
            - Windows: `.msi` or `.exe` (NSIS)
            - Linux: `.AppImage` or `.deb`
            - Arch Linux: `yay -S e2e-chat-bin` (AUR)
            - Android: `.apk` (attached by the Android workflow)

            Verify your download against `SHA256SUMS-<platform>.txt`.

            On first launch, enter your server's Tailscale address
            (e.g. `https://100.x.x.x:3443`) and click **Test connection**.

            To update later, download the new installer from this page again.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} ${{ env.SIGNING_ARGS }}

      # Manual run → build only; the installers are uploaded as artifacts.
      - name: Build installers (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }} ${{ env.SIGNING_ARGS }}

      # ---------------------------------------------------------------------
      # Fail loudly if the bundle produced nothing. Without this the release
      # job "succeeds" while publishing a release with only the auto-generated
      # source archives — the exact symptom this guard exists to prevent.
      # ---------------------------------------------------------------------
      - name: Verify installers were produced
        shell: bash
        run: |
          found=$(find src-tauri/target -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' \) | wc -l)
          echo "Found $found installer file(s):"
          find src-tauri/target -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' \) -print
          if [ "$found" -eq 0 ]; then
            echo "::error::No installers were bundled — the build did not produce a release artifact."
            exit 1
          fi

      - name: Upload installers (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-chat-${{ matrix.label }}
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # Checksums: one file per platform so a partial download only ever
      # invalidates that platform's list.
      # ---------------------------------------------------------------------
      - name: Generate checksums
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          out="$GITHUB_WORKSPACE/SHA256SUMS-${{ matrix.label }}.txt"
          : > "$out"
          while IFS= read -r -d '' f; do
            h=$(sha256sum "$f" | cut -d' ' -f1)
            echo "$h  $(basename "$f")" >> "$out"
          done < <(find src-tauri/target -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' \) -print0)
          echo "--- $out"
          cat "$out"

      - name: Attach checksums to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SHA256SUMS-*.txt
          fail_on_unmatched_files: false

      # ---------------------------------------------------------------------
      # Arch Linux: render this tag's AUR package from the .deb just published
      # and push it to the Arch User Repository, so pacman users install with
      # `yay -S e2e-chat-bin` instead of hand-wrapping a .deb. The recipe is
      # packaging/aur/PKGBUILD.template; packaging/aur/README.md covers the
      # one-time AUR account + AUR_SSH_KEY setup.
      #
      # Tag pushes only (this is a release action), Linux leg only (that is
      # where the .deb lives), and gated on the secret exactly like the
      # Windows certificate above. A failing AUR push fails this job AFTER the
      # release and its checksums are already public — the release is fine, the
      # red job is the signal to fix the key.
      # ---------------------------------------------------------------------
      - name: Publish PKGBUILD to the AUR
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'ubuntu-22.04' && env.AUR_SSH_KEY != ''
        shell: bash
        env:
          AUR_PACKAGE: e2e-chat-bin
        run: |
          set -euo pipefail

          # Pin the package to exactly what we published: take the hash from
          # the checksum list users verify rather than re-summing a file that
          # could have changed, and abort if the .deb is not in that list —
          # the AUR must never carry a hash this release did not attest to.
          #
          # The list was written from the ON-DISK basename, which is
          # "E2E Chat_…_amd64.deb" (space), while the GitHub asset — and thus
          # the PKGBUILD's download URL — is "E2E.Chat_…" (dot; GitHub
          # normalises spaces on upload, both verified 200/404 against the
          # v0.2.21 release). Either way the name contains spaces, so awk must
          # reassemble fields 2..NF: `$2 == f` would match nothing and abort
          # every publish.
          deb="$(find src-tauri/target -type f -name '*.deb' -print -quit)"
          base="$(basename "$deb")"
          sha="$(awk -v f="$base" '{ n=$2; for (i=3; i<=NF; i++) n=n " " $i; if (n == f) print $1 }' SHA256SUMS-linux-x64.txt)"
          if [ -z "$sha" ]; then
            echo "::error::'$base' is missing from SHA256SUMS-linux-x64.txt — refusing to publish an unverifiable PKGBUILD to the AUR."
            exit 1
          fi

          out="$RUNNER_TEMP/aur-render"
          node tools/aur-render.mjs --pkgver "${GITHUB_REF_NAME#v}" --sha256 "$sha" --outdir "$out"
          echo "--- PKGBUILD ---"
          cat "$out/PKGBUILD"
          echo "--- .SRCINFO ---"
          cat "$out/.SRCINFO"

          # AUR pushes go over SSH from a key registered on the account.
          # accept-new pins the host key on first use (TOFU) instead of
          # disabling the check; %b forgives a key pasted with literal \n
          # instead of real line breaks. The key itself is never echoed.
          key="$RUNNER_TEMP/aur_key"
          printf '%b\n' "$AUR_SSH_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          # Cloning a package name that does not exist yet yields an empty
          # repo (documented AUR behaviour) — the first push creates the
          # package, so there is no separate bootstrap step.
          repo="$RUNNER_TEMP/aur-repo"
          git -c init.defaultBranch=master clone "ssh://aur@aur.archlinux.org/$AUR_PACKAGE.git" "$repo"

          # The AUR tree must contain exactly what we render: clear anything
          # stale (e.g. leftovers after a rename), then copy the three files.
          find "$repo" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$out/PKGBUILD" "$out/.SRCINFO" "packaging/aur/$AUR_PACKAGE.install" "$repo/"

          git -C "$repo" config user.name "MaskBoy999"
          git -C "$repo" config user.email "MaskBoy999@users.noreply.github.com"
          git -C "$repo" add -A
          if git -C "$repo" diff --cached --quiet; then
            echo "AUR package already at ${GITHUB_REF_NAME#v} — nothing to push."
            exit 0
          fi
          git -C "$repo" commit -m "Update to ${GITHUB_REF_NAME#v}"
          git -C "$repo" push origin HEAD

      # ---------------------------------------------------------------------
      # Signing is wired but was never *verified* — prove it on every release
      # that has a certificate, so a silent mis-configuration can't ship.
      # ---------------------------------------------------------------------
      - name: Verify Windows signature
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Path src-tauri/target -Recurse -Include *.exe,*.msi |
            Where-Object { $_.FullName -match '\\bundle\\' } |
            ForEach-Object {
              $sig = Get-AuthenticodeSignature $_.FullName
              Write-Host "$($_.Name): $($sig.Status)"
              if ($sig.Status -ne 'Valid') { $bad++ }
            }
          if ($bad -gt 0) {
            Write-Error "$bad bundled file(s) are not validly signed."
            exit 1
          }
