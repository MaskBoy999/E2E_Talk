name: Build Desktop Box

# Push a tag like v0.2.2 to publish installers users can download straight from
# the GitHub Releases page. Run it manually from the Actions tab to get the
# installers as workflow artifacts without publishing a release.
#
# Code signing is OPTIONAL and secret-gated: with no secrets configured the
# builds still succeed, they just warn on first launch (SmartScreen). Configure
# these repository secrets to turn it on:
#
#   Windows code signing
#     WINDOWS_CERTIFICATE             base64 of a code-signing .pfx
#     WINDOWS_CERTIFICATE_PASSWORD    password for that .pfx
#
# There is deliberately NO auto-updater (users re-download each release — see
# WEBSITE_IN_A_BOX_MASTER_PLAN.md §8), so no update-signing key is involved.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Publishing runs through `gh release` (see "Publish release assets"), which
# needs write access to the repository contents. That access is granted per JOB
# below, not workflow-wide: every third-party action in this file is pinned to
# a full commit SHA, and neither the pin nor the write scope would be worth
# much if one compromised step could use a token that every other step holds.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Exactly ONE actor creates the release object for a tag.
  #
  # v0.2.33 published TWO release objects for the same tag: one carried all ten
  # assets, the other was empty, and /releases/latest resolved to the EMPTY one —
  # so the public download page advertised a release with no files at all.
  # Three creators were racing for that tag: tauri-action on each of the two
  # matrix legs (its tagName/releaseBody keys are what make it create a release)
  # and the `gh release create` fallback inside "Publish release assets".
  # GitHub's tag_name uniqueness check is not atomic, so two simultaneous POSTs
  # both succeed and two release objects exist for one tag.
  #
  # Creating it here, once, BEFORE any build leg may start, removes the race by
  # construction. Every other step only ever uploads with --clobber, which is
  # idempotent and therefore safe to re-run.
  # ---------------------------------------------------------------------------
  create-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # `gh` resolves the repository from the git remote, so this job needs a
      # checkout: without one it is not inside a repository at all and every
      # `gh release` call fails. The v0.2.34 attempt died exactly here —
      # "Create release" was the only failing step, and the build legs (which
      # do check out) are where gh has always worked. `-R "$repo"` below is
      # the belt-and-braces half so the commands stay correct on their own.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          gh --version | head -1
          echo "create-release: tag=$tag repo=$repo"
          # Re-running a tag must FINISH the existing release, never make a
          # second one. Notes are written on the create path only: this token
          # can create a release and upload assets to it, but `update-a-release`
          # (a PATCH, i.e. `gh release edit`) comes back "Resource not
          # accessible by integration" — the wall softprops died on across
          # v0.2.22 and v0.2.24.
          if gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            echo "release $tag already exists — leaving its notes alone"
            exit 0
          fi
          notes=$(cat <<'NOTES'
          Native desktop app for E2E Chat — no browser required.

          **Install:** download the file for your platform below and run it.
          - Windows: `.msi` or `.exe` (NSIS)
          - Linux: `.AppImage` or `.deb`
          - Arch Linux: `.pkg.tar.zst` — download it and run `sudo pacman -U <file>`
          - Android: `.apk` (attached by the Android workflow)

          Verify your download against `SHA256SUMS-<platform>.txt`.

          **Linux / Arch: window opens but stays grey or blank?** That is
          WebKitGTK's accelerated renderer, not a missing dependency — every
          shared library the binary needs is verified on a real Arch userland
          before this release is published. The app already ships with the
          safe renderer path enabled by default on Linux; if you still see a
          blank window, force it explicitly:

          ```
          WEBKIT_DISABLE_DMABUF_RENDERER=1 e2e-chat-app
          WEBKIT_DISABLE_COMPOSITING_MODE=1 e2e-chat-app   # last resort
          ```

          `E2E_CHAT_WEBKIT_DMABUF=1` opts back into the fast path.

          On first launch, enter your server's Tailscale address
          (e.g. `https://100.x.x.x:3443`) and click **Test connection**.

          To update later, download the new installer from this page again.
          NOTES
          )
          # gh's own message is the only thing that explains a failure here —
          # job logs need authentication even on a public repo — so the create
          # keeps its stderr and re-emits it as an annotation instead of dying
          # with a bare exit code. That is exactly how the v0.2.35 tag failed:
          # "Process completed with exit code 1" and nothing else, while the
          # release it had just created sat there with zero assets and both
          # build legs skipped (the job `needs` this one).
          # ...and it is RETRIED, because that first exit code was a 502:
          # GitHub answered the POST with "We had issues producing the
          # response" (2026-09-28) while creating the release anyway. A
          # transient 5xx must not decide whether a tag publishes, and a
          # retry must never make a second release object — the view first.
          created=0
          rc=1
          for attempt in $(seq 1 5); do
            if gh release view "$tag" -R "$repo" >/dev/null 2>&1; then created=1; break; fi
            set +e
            gh release create "$tag" -R "$repo" --title "E2E Chat $tag" --notes "$notes" \
              2>"$RUNNER_TEMP/create-release.err"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then created=1; break; fi
            echo "::warning::gh release create for $tag failed on attempt $attempt (exit $rc): $(tr -d '\r' < "$RUNNER_TEMP/create-release.err" | tr '\n' ' ')"
            sleep $((attempt * 5))
          done
          if [ "$created" -ne 1 ]; then
            BLOCK="Create release failed for $tag after 5 attempts (last gh create exited $rc):%0A$(sed -e 's/%/%25/g' -e 's/\r$//' "$RUNNER_TEMP/create-release.err" | sed ':a;N;$!ba;s/\n/%0A/g')"
            printf '::error::%s\n' "$BLOCK"
            exit "$rc"
          fi
          # Verify it is really there before the build legs start uploading —
          # with retries, not one immediate look. A create that has just
          # returned can be a moment ahead of a view, and a single un-retried
          # read-back is a plausible reading of the v0.2.35 failure above: the
          # release DID exist (created the same second) while this check exited
          # 1, and every step after it was skipped.
          ready=0
          for _ in $(seq 1 10); do
            if gh release view "$tag" -R "$repo" >/dev/null 2>>"$RUNNER_TEMP/read-back.err"; then ready=1; break; fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            BLOCK="release $tag could not be read back for 30 s after being created:%0A$(sed -e 's/%/%25/g' -e 's/\r$//' "$RUNNER_TEMP/read-back.err" 2>/dev/null | sed ':a;N;$!ba;s/\n/%0A/g')"
            printf '::error::%s\n' "$BLOCK"
            exit 1
          fi

          # Then make sure it is PUBLISHED, not merely present. This is the
          # v0.2.35 failure in full: GitHub processes a deleted tag
          # ASYNCHRONOUSLY and forces that tag's release back to DRAFT — even
          # one created (or whose tag was re-pushed) afterwards. It is a known
          # platform quirk, filed as cli/cli#8458 and labelled a problem on
          # GitHub's side rather than the CLI's. A draft is invisible:
          # /releases/latest skips it, the download page lists nothing, and —
          # the failure that actually broke that run — makepkg cannot fetch the
          # .deb from releases/download/$tag/ (404), so the Linux leg died after
          # uploading its installers and the release ended up with no Arch
          # package and no SHA256SUMS-linux-x64.txt while the Windows leg still
          # reported success. Moving a tag is this repo's normal recovery after
          # a failed release job, so the workflow has to publish the draft
          # itself.
          published=0
          pub_rc=0
          for attempt in $(seq 1 6); do
            is_draft=$(gh release view "$tag" -R "$repo" --json isDraft --jq .isDraft)
            if [ "$is_draft" != "true" ]; then published=1; break; fi
            echo "release $tag came back as a DRAFT (attempt $attempt) — publishing it"
            set +e
            gh release edit "$tag" -R "$repo" --draft=false 2>"$RUNNER_TEMP/publish-draft.err"
            pub_rc=$?
            set -e
            if [ "$pub_rc" -ne 0 ]; then
              echo "::warning::gh release edit --draft=false exited $pub_rc: $(tr -d '\r' < "$RUNNER_TEMP/publish-draft.err" | tr '\n' ' ')"
            fi
            # The forced-draft event can land just AFTER a successful publish,
            # so re-read instead of trusting the exit code.
            sleep 5
          done
          if [ "$published" -ne 1 ]; then
            BLOCK="Release $tag is still a DRAFT, so nothing is downloadable and the Arch step cannot fetch its own .deb (404). gh release edit --draft=false exited $pub_rc:%0A$(sed -e 's/%/%25/g' -e 's/\r$//' "$RUNNER_TEMP/publish-draft.err" 2>/dev/null | sed ':a;N;$!ba;s/\n/%0A/g')%0APublish it from https://github.com/$repo/releases and re-run this workflow. (GitHub forces the release of a just-deleted tag back to draft — see cli/cli#8458.)"
            printf '::error::%s\n' "$BLOCK"
            exit 1
          fi
          echo "release $tag is live"

  build:
    # The release object must exist before either leg uploads to it.
    needs: create-release
    # contents: write  — publish installers/checksums to the release
    # id-token+attestations: write — build-provenance attestation below
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
            label: linux-x64
          - platform: windows-latest
            args: ''
            label: windows-x64
    runs-on: ${{ matrix.platform }}
    # `secrets` is not usable in step `if:` conditions, so the signing secrets
    # are surfaced as env vars and the gates below test `env.*`.
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Tauri's Linux toolchain.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Pinned to a master-history commit (the action requires a SHA that is in
      # master's history) and selects the toolchain via the input instead of the
      # @rev, per dtolnay/rust-toolchain's own pinning instructions.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # ---------------------------------------------------------------------
      # tauri-action builds by running the *project's own* script
      # (`npm run tauri build -- --config …`), so the CLI has to be installed —
      # package.json declares it, but with no node_modules on the runner npm
      # fails (exit 127 / "Missing script"). That is why every desktop release
      # from v0.2.1 on failed here while the Android workflow, which does run
      # `npm ci`, kept getting further. Same root cause, same fix.
      # ---------------------------------------------------------------------
      - name: Install Tauri CLI
        run: npm ci

      # ---------------------------------------------------------------------
      # A single config file carries the optional build tweaks, so we never have
      # to pass two `--config` flags (their precedence is easy to get wrong).
      # Starts as an empty object; the Windows step below merges the cert into
      # it when a certificate secret exists.
      # ---------------------------------------------------------------------
      - name: Prepare signing config
        shell: bash
        run: |
          echo '{}' > ci-signing.conf.json
          # `pwd -W` (Git Bash) yields a Windows path the Rust CLI can open;
          # plain `pwd` is the POSIX path on Linux.
          workdir="$(pwd -W 2>/dev/null || pwd)"
          echo "SIGNING_ARGS=--config \"$workdir/ci-signing.conf.json\"" >> "$GITHUB_ENV"
          cat ci-signing.conf.json

      # ---------------------------------------------------------------------
      # Windows: import the .pfx, read its thumbprint, and merge it into the
      # same config file so every .exe/.msi is signed with it.
      # ---------------------------------------------------------------------
      - name: Import Windows code signing certificate
        id: win-sign
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, $bytes)
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          $conf = Join-Path $GITHUB_WORKSPACE 'ci-signing.conf.json'
          $json = if (Test-Path $conf) { Get-Content $conf -Raw | ConvertFrom-Json } else { [pscustomobject]@{} }
          if (-not $json.PSObject.Properties.Contains('bundle')) {
            $json | Add-Member -NotePropertyName bundle -NotePropertyValue ([pscustomobject]@{})
          }
          $json.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm       = 'sha256'
            timestampUrl          = 'http://timestamp.digicert.com'
          }) -Force
          $json | ConvertTo-Json -Depth 8 | Set-Content -Path $conf -Encoding utf8
          Write-Host "Signing with thumbprint $($cert.Thumbprint)"

      # Build only — publishing happens explicitly in "Publish release assets"
      # below.
      #
      # This step used to carry tagName/releaseName/releaseBody, and those keys
      # are precisely what make tauri-action create the release itself. On the
      # v0.2.33 tag BOTH matrix legs did that at once and GitHub created two
      # release objects for the one tag, so /releases/latest pointed at the
      # empty one and the download page showed no files. The release object is
      # created once by the create-release job now; this step only ever builds.
      # It is also used for manual (non-tag) runs, which stay artifact-only.
      - name: Build installers
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          args: ${{ matrix.args }} ${{ env.SIGNING_ARGS }}

      # ---------------------------------------------------------------------
      # Fail loudly if the bundle produced nothing. Without this the release
      # job "succeeds" while publishing a release with only the auto-generated
      # source archives — the exact symptom this guard exists to prevent.
      # ---------------------------------------------------------------------
      - name: Verify installers were produced
        shell: bash
        run: |
          # Only the *bundle* directory holds published installers. Globbing all
          # of target/ also matched cargo's build-script intermediates, so the
          # count could never prove a bundle was missing; the .rpm was not
          # matched at all.
          found=$(find src-tauri/target/release/bundle -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) | wc -l)
          echo "Found $found installer file(s):"
          find src-tauri/target/release/bundle -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print
          if [ "$found" -eq 0 ]; then
            echo "::error::No installers were bundled — the build did not produce a release artifact."
            exit 1
          fi

      - name: Upload installers (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-chat-${{ matrix.label }}
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # Publish THIS leg's installers, from the files just built, with `gh`.
      #
      # Why not leave it to tauri-action (which still runs above and does
      # publish): the release object appears at the START of the run, and the
      # two matrix legs race to create/update it — after which the losing
      # leg's assets silently never upload. That is exactly what happened on
      # v0.2.24: the release carried only the two Windows bundles, makepkg
      # then 404'd on the .deb it was told to repack (the reason the Arch step
      # failed too), and softprops died trying to patch it up afterwards.
      #
      # Uploading the local bundle directory ourselves cannot silently lose
      # files — "Verify installers were produced" above already proved they
      # exist — and running BEFORE the Arch step guarantees the .deb that
      # makepkg downloads is published by the time it asks for it. --clobber
      # is idempotent, so this survives a re-run of the same tag (creating
      # was the part that used to fail with "already_exists").
      # ---------------------------------------------------------------------
      # SLSA-style provenance for the bytes this job just built. Signed by
      # GitHub's OIDC identity for this workflow; downstream users can verify
      # with `gh attestation verify <file> -R <repo>`. The subject glob is the
      # same bundle tree the checksum step covers.
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'src-tauri/target/release/bundle/**'

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # Wait for the release created by the create-release job this build
          # `needs` (a couple of seconds of API lag at most). It is deliberately
          # NEVER created here: a create call from this step is one of the
          # racing creators that produced two release objects for v0.2.33.
          for _ in $(seq 1 30); do
            gh release view "$tag" >/dev/null 2>&1 && break
            sleep 2
          done
          # Loud when it genuinely never appeared — no silent orphan upload.
          gh release view "$tag" >/dev/null

          # Then re-assert that it is PUBLISHED, here, minutes after it was
          # created and immediately before the Arch step downloads from it.
          # A gate in the create job alone cannot cover this: GitHub processes
          # a deleted (or re-pushed) tag asynchronously and forces that tag's
          # release back to DRAFT whenever the queue gets to it, which is
          # *later* — cli/cli#8458, a documented platform quirk. A draft 404s
          # for anonymous readers, and that is precisely how the v0.2.35 Linux
          # leg died: this step uploaded the .deb, makepkg then failed to fetch
          # it ("curl: (22) The requested URL returned error: 404"), and the
          # Arch package and SHA256SUMS-linux-x64.txt never appeared while the
          # Windows leg still reported success.
          published=0
          pub_rc=0
          for attempt in $(seq 1 6); do
            is_draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
            if [ "$is_draft" != "true" ]; then published=1; break; fi
            echo "::warning::release $tag is a DRAFT before the Arch step — publishing it (attempt $attempt)"
            set +e
            gh release edit "$tag" --draft=false 2>"$RUNNER_TEMP/publish-draft.err"
            pub_rc=$?
            set -e
            if [ "$pub_rc" -ne 0 ]; then
              echo "::warning::gh release edit --draft=false exited $pub_rc: $(tr -d '\r' < "$RUNNER_TEMP/publish-draft.err" | tr '\n' ' ')"
            fi
            sleep 5
          done
          if [ "$published" -ne 1 ]; then
            BLOCK="release $tag is a DRAFT, so every asset on it 404s for anonymous readers — including the .deb the Arch step is about to download from this very release. gh release edit --draft=false exited $pub_rc:%0A$(sed -e 's/%/%25/g' -e 's/\r$//' "$RUNNER_TEMP/publish-draft.err" 2>/dev/null | sed ':a;N;$!ba;s/\n/%0A/g')%0APublish it from https://github.com/$GITHUB_REPOSITORY/releases and re-run this tag. (GitHub forces the release of a just-deleted tag back to draft — see cli/cli#8458.)"
            printf '::error::%s\n' "$BLOCK"
            exit 1
          fi

          # GitHub replaces spaces (and a few other characters — ( ) ~ :) in
          # an uploaded asset's name with dots. That is built-in upload
          # behavior, not a gh CLI quirk (cli/cli#10585, community
          # discussion #60449). The Tauri bundles carry the product name,
          # "E2E Chat", so every published asset is `E2E.Chat_...` while the
          # file on disk is `E2E Chat_...` — and "Generate checksums" below
          # lists the ON-DISK name, so the v0.2.45 release shipped SHA256SUMS
          # entries whose names exist nowhere on the release: `sha256sum -c`
          # failed on a pristine download even though every hash matched.
          #
          # Rename the bundles HERE — before the upload and before the
          # checksum list is written — so disk name, asset name and checksum
          # name agree by construction, without re-implementing GitHub's
          # sanitizer. The bytes are untouched, so the Arch PKGBUILD (which
          # downloads the dotted name) and the provenance attestation still
          # describe the same files.
          for f in src-tauri/target/release/bundle/*/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.exe | *.msi | *.AppImage | *.deb | *.rpm) ;;
              *) continue ;;
            esac
            base="${f##*/}"
            safe=$(printf '%s' "$base" | tr ' ()~:' '.....')
            [ "$safe" = "$base" ] || mv "$f" "${f%/*}/$safe"
          done

          # Exactly the bundles this leg produced. On Windows the AppImage/deb
          # globs simply match nothing (nullglob drops them); the legs never
          # produce the same file name, so concurrent uploads cannot collide.
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/*/*.msi
                 src-tauri/target/release/bundle/*/*.exe
                 src-tauri/target/release/bundle/*/*.AppImage
                 src-tauri/target/release/bundle/*/*.deb
                 src-tauri/target/release/bundle/*/*.rpm)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installers to publish — the bundle step produced nothing."
            exit 1
          fi
          # Job logs need auth even on a public repo, so a bare failure here
          # would be invisible to anyone not signed in as the owner. Capture
          # gh's own message and re-emit it as an annotation — the same trick
          # the Arch step and android.yml use.
          set +e
          gh release upload "$tag" "${files[@]}" --clobber 2>"$RUNNER_TEMP/publish.err"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            BLOCK="Publishing to $tag failed (gh release upload, exit $rc):%0A$(sed -e 's/%/%25/g' -e 's/\r$//' "$RUNNER_TEMP/publish.err" | sed ':a;N;$!ba;s/\n/%0A/g')"
            printf '::error::%s\n' "$BLOCK"
            exit "$rc"
          fi
          # A log line only — never allowed to fail the step here, which would
          # skip the Arch and checksum steps that follow it.
          gh release view "$tag" --json assets \
            --jq '"published: " + ([.assets[].name] | sort | join(", "))' || true

      # ---------------------------------------------------------------------
      # Arch Linux: build a real pacman package for this tag — no AUR account
      # involved (GitHub has no Arch runner, so the build runs inside the
      # official archlinux container, the standard pattern for Arch packaging
      # in CI). packaging/aur/PKGBUILD.template is rendered for this tag, then
      # makepkg fetches the .deb we just published — the identical download an
      # Arch user performs, which doubles as proof the published asset exists
      # — and repacks it.
      #
      # The artifact is then read back with pacman itself: `pacman -Qp` must
      # report a name/version matching the tag (the v0.2.19 lesson — version
      # drift here installs as a phantom re-update of the previous release)
      # and the file list must be real. Anything odd fails the release instead
      # of shipping. Tag pushes only, Linux leg only (where the .deb lives).
      #
      # BEFORE THIS: the workflow pushed a PKGBUILD to the AUR on every tag.
      # There is no AUR account, so that step could only ever skip — and a
      # reintroduced push would fail every release. tests/arch-packaging.spec.ts
      # asserts the AUR push never comes back.
      # ---------------------------------------------------------------------
      - name: Build Arch package (pacman)
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          pkgver="${GITHUB_REF_NAME#v}"
          deb="$(find src-tauri/target -type f -name '*.deb' -print -quit)"
          # makepkg verifies its download against this hash. The checksum list
          # generated below covers the same bytes, so the two agree by
          # construction; computing it here keeps the steps independent (the
          # list does not exist yet at this point in the job).
          sha="$(sha256sum "$deb" | cut -d' ' -f1)"
          out="$RUNNER_TEMP/arch-render"
          node tools/aur-render.mjs --pkgver "$pkgver" --sha256 "$sha" --outdir "$out"
          echo "--- PKGBUILD ---"
          cat "$out/PKGBUILD"

          # Coverage check BEFORE building: every dependency the published .deb
          # declares must be covered by this PKGBUILD's depends (Debian names
          # mapped to Arch names), and every shared library the packaged binary
          # references must resolve to an Arch package. The .deb is generated by
          # Tauri on Ubuntu and the depends here are written by hand for Arch;
          # nothing else compares the two, which is how "install works, app is
          # grey" stays invisible until a user reports it.
          node tools/check-arch-deps.mjs --deb "$deb" --pkgbuild "$out/PKGBUILD"

          mkdir -p dist
          # Job logs 403 for anonymous readers even on public repos (the
          # lesson written into android.yml), so tee the container output and
          # — on failure — re-emit its tail as an annotation: the one failure
          # surface that IS publicly readable.
          set +e
          # The container script lives in packaging/aur/build-in-container.sh
          # and is MOUNTED — never passed as an inline `bash -ec '...'`
          # argument. Wrapping a script in single quotes means the first single
          # quote inside it closes the wrapper: the `grep 'not found'` line at
          # the bottom truncated the script mid-pipeline, the container ran
          # everything up to that point (makepkg built, `pacman -Qp` printed
          # the right version) and then died with "unexpected EOF while looking
          # for matching `)'" — exit 2, which is what failed the v0.2.33 tag
          # run and left the log looking mysterious. A file cannot be mangled
          # by the caller's quoting, and `bash -n` can check it in tests
          # (tests/arch-packaging.spec.ts does, on every run).
          script="$RUNNER_TEMP/build-in-container.sh"
          # Strip CR on the way in: this tree is checked out with
          # core.autocrlf=true, and a \r at the end of every line is fatal to a
          # script executed in a Linux container — even `set -euo pipefail`
          # becomes an invalid option name. (Inline run: blocks never hit this
          # because YAML parses CRLF as a newline.)
          tr -d '\r' < packaging/aur/build-in-container.sh > "$script"
          chmod +x "$script"
          docker run --rm \
            -v "$out":/pkgbuild:ro \
            -v "$script":/build.sh:ro \
            -v "$PWD/dist":/dist \
            -e PKGVER="$pkgver" \
            archlinux:base-devel bash /build.sh 2>&1 | tee "$RUNNER_TEMP/arch-build.log"
          # PIPESTATUS[0] is docker's status; a bare $? here would be tee's,
          # which is always 0. (pipefail is on as well, but do not rely on
          # that silently — an added `set +o pipefail` would un-fail the step.)
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            BLOCK="Arch package build failed (exit $rc) — tail of the container log:%0A$(tail -n 25 "$RUNNER_TEMP/arch-build.log" | sed -e 's/%/%25/g' -e 's/\r$//' | sed ':a;N;$!ba;s/\n/%0A/g')"
            printf '::error::%s\n' "$BLOCK"
            exit "$rc"
          fi
          ls -la dist/

      # ---------------------------------------------------------------------
      # Checksums: one file per platform so a partial download only ever
      # invalidates that platform's list. Includes the Arch package, so it is
      # covered by the same verification line the release notes advertise.
      # ---------------------------------------------------------------------
      - name: Generate checksums
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          out="$GITHUB_WORKSPACE/SHA256SUMS-${{ matrix.label }}.txt"
          : > "$out"
          while IFS= read -r -d '' f; do
            h=$(sha256sum "$f" | cut -d' ' -f1)
            echo "$h  $(basename "$f")" >> "$out"
          # Only the published *bundles* count. Searching all of target/ also
          # matched cargo's build-script intermediates (51 build-script-build
          # .exe files polluted SHA256SUMS-windows-x64.txt), and the .rpm was
          # missing entirely, so a downloaded .rpm could not be verified against
          # the list the release notes advertise.
          done < <(find src-tauri/target/release/bundle -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0)
          # The Arch package lives outside target/ (and only exists on the
          # Linux leg of a tag run) — append it when present.
          if [ -d dist ]; then
            while IFS= read -r -d '' f; do
              h=$(sha256sum "$f" | cut -d' ' -f1)
              echo "$h  $(basename "$f")" >> "$out"
            done < <(find dist -type f -name '*.pkg.tar.zst' -print0)
          fi
          echo "--- $out"
          cat "$out"

      # ---------------------------------------------------------------------
      # The checksum lists and the Arch package join the release through the
      # same `gh` uploader. This step was softprops/action-gh-release, which
      # cannot complete an EXISTING release: on the v0.2.22 and v0.2.24 tags it
      # failed with "already_exists" and "Resource not accessible by
      # integration ... update-a-release", publishing releases that carried
      # binaries but no checksums at all. --clobber is idempotent, so a re-run
      # finishes the release instead of dying on assets that already exist.
      # ---------------------------------------------------------------------
      - name: Attach checksums to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          shopt -s nullglob
          # dist/*.pkg.tar.zst exists on the Linux leg of a tag run only.
          files=(SHA256SUMS-*.txt dist/*.pkg.tar.zst)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No checksum files to attach."
            exit 1
          fi
          gh release upload "$tag" "${files[@]}" --clobber
          gh release view "$tag" --json assets \
            --jq '"assets now: " + ([.assets[].name] | sort | join(", "))' || true

      # ---------------------------------------------------------------------
      # Signing is wired but was never *verified* — prove it on every release
      # that has a certificate, so a silent mis-configuration can't ship.
      # ---------------------------------------------------------------------
      - name: Verify Windows signature
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Path src-tauri/target -Recurse -Include *.exe,*.msi |
            Where-Object { $_.FullName -match '\\bundle\\' } |
            ForEach-Object {
              $sig = Get-AuthenticodeSignature $_.FullName
              Write-Host "$($_.Name): $($sig.Status)"
              if ($sig.Status -ne 'Valid') { $bad++ }
            }
          if ($bad -gt 0) {
            Write-Error "$bad bundled file(s) are not validly signed."
            exit 1
          }
