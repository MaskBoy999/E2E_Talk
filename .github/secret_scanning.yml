# Third-party bundles we ship verbatim, and only those.
#
# `static/vendor/asr/` holds transformers.js, the onnxruntime-web wasm builds
# and the quantized whisper model, copied byte-for-byte from npm and
# Hugging Face by `tools/fetch-asr-assets.mjs` so that live captions can run
# entirely offline (see PROGRESS.md). It is minified, so its identifiers are
# long unbroken alphanumerics -- and a minified class name is indistinguishable
# from the string shape secret scanners look for. GitHub's push protection
# flagged exactly that in `transformers.min.js` as a "Mistral AI API Key" and
# refused the v0.2.33 push.
#
# The alternative to excluding the path is patching the vendored bytes, which
# would make the committed tree differ from the package it claims to be a copy
# of, and would come back on every re-vendor. Nothing else in the repo is
# excluded, and this directory contains no credentials: it is model weights,
# a wasm runtime and two JS bundles.
paths-ignore:
  - "static/vendor/**"
